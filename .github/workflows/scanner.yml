name: 24/7 RSI + Bollinger Squeeze Scanner

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs automatically every 5 minutes safely 24/7
  workflow_dispatch:

jobs:
  run-rsi-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install ccxt pandas numpy requests tabulate

      - name: Run Python Scanner Script
        run: |
          python rsi_bbsz_ob.py
